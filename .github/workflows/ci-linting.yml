name: CI Code Quality & Linting

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '**/*.py'
      - '**/*.sql'
      - '.github/workflows/ci-linting.yml'

jobs:
  lint-python-and-sql:
    name: Code Quality Checks (Python & SQL)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the pull request branch code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Install Ruff (Python linter) and SQLFluff (SQL linter)
      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff sqlfluff-templater-dbt

      # Step 4: Run Python Linting & Format Checking
      - name: Python Linting (Ruff)
        run: |
          echo "::group::Running Ruff Linter"
          ruff check .
          echo "::endgroup::"
          
          echo "::group::Checking Python Code Formatting"
          ruff format --check .
          echo "::endgroup::"

      # Step 5: Run SQL Linting (SQLFluff)
      - name: SQL Linting (SQLFluff)
        # Continue on error if no SQL files exist, or fail if lint rules are violated
        run: |
          echo "::group::Running SQLFluff Linter"
          sqlfluff lint --dialect databricks .
          echo "::endgroup::"