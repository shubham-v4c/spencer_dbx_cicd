name: 'Production deployment'

concurrency: 1

on:
  push:
    branches:
      - main
    paths:
      - 'spencer_cicd_poc/**'

jobs:
  deploy:
    name: 'Deploy bundle'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@main

      - name: Validate Prod Bundle
        run: databricks bundle validate -t prod
        working-directory: spencer_cicd_poc
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_HOST }}
          DATABRICKS_CLIENT_ID: '3284d68f-e46d-4559-835f-388da390ef55'
          DATABRICKS_CLIENT_SECRET: ${{ secrets.SP_PROD_DEMO_TOKEN1 }}
          DATABRICKS_BUNDLE_ENV: prod

      - name: Deploy Prod Bundle
        run: databricks bundle deploy -t prod --auto-approve
        working-directory: spencer_cicd_poc
        env:
          DATABRICKS_HOST: ${{ secrets.PROD_HOST }}
          DATABRICKS_CLIENT_ID: '3284d68f-e46d-4559-835f-388da390ef55'
          DATABRICKS_CLIENT_SECRET: ${{ secrets.SP_PROD_DEMO_TOKEN1 }}
          DATABRICKS_BUNDLE_ENV: prod
