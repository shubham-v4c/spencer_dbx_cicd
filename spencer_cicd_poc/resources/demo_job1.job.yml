resources:
  jobs:
    demo_job1:
      name: demo_job1
      tasks:
        - task_key: filterbycountry
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/demo_job1/filterbycountry.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
