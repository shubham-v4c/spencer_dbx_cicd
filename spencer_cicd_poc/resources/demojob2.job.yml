resources:
  jobs:
    demojob2:
      name: demojob2
      tasks:
        - task_key: demojob2
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/demojob2/filterbygender.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
