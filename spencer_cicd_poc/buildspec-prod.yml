version: 0.2

env:
  variables:
    TARGET_ENV: "prod"
  secrets-manager:
    DATABRICKS_HOST: "cicd/prod/host:PROD_DATABRICKS_HOST"
    DATABRICKS_CLIENT_ID: "cicd/prod/sp:PROD_DATABRICKS_CLIENT_ID"
    DATABRICKS_CLIENT_SECRET: "cicd/prod/spkey:PROD_DATABRICKS_CLIENT_SECRET"

phases:
  install:
    commands:
      - echo "Installing Databricks CLI..."
      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

  pre_build:
    commands:
      - echo "Validating Databricks Asset Bundle for target $TARGET_ENV..."
      - databricks bundle validate --target $TARGET_ENV

  build:
    commands:
      - echo "Deploying Databricks Asset Bundle to target $TARGET_ENV..."

      - databricks bundle deploy --target $TARGET_ENV
